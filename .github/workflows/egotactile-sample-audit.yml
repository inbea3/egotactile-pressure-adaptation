name: EgoTactile small archive smoke audit

on:
  push:
    branches: [main]
    paths:
      - "scripts/download_sample_oxt_audit.py"
      - "scripts/inspect_oxt_archive.py"
      - "scripts/audit_oxt_zarr.py"
      - "scripts/__init__.py"
      - ".github/workflows/egotactile-sample-audit.yml"
  workflow_dispatch:
    inputs:
      objects:
        description: "Comma-separated object archive names (without .zip)"
        required: true
        default: "GlassBowl,Orange,Toothpaste"

permissions:
  contents: read

jobs:
  sample-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependency
        run: python -m pip install --upgrade huggingface_hub "zarr<3" numcodecs
      - name: Download and inventory selected object archives
        env:
          OBJECTS: ${{ github.event.inputs.objects || 'GlassBowl,Orange,Toothpaste' }}
        run: |
          python scripts/download_sample_oxt_audit.py --objects "$OBJECTS" --output results/egotactile_sample_archive_audit.json
      - name: Upload metadata-only audit report
        uses: actions/upload-artifact@v4
        with:
          name: egotactile-sample-archive-audit
          path: results/egotactile_sample_archive_audit.json
          retention-days: 30
