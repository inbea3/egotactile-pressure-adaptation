name: EgoTactile full Stage 0 inventory

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_full_egotactile_inventory.py"
      - "scripts/audit_oxt_zarr.py"
      - ".github/workflows/egotactile-full-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: python -m pip install --upgrade huggingface_hub "zarr<3" numcodecs
      - name: Inventory all 63 object archives (pressure-only)
        run: |
          python scripts/run_full_egotactile_inventory.py --output results/egotactile_full_stage0_inventory.json
      - name: Upload full inventory report
        uses: actions/upload-artifact@v4
        with:
          name: egotactile-full-stage0-inventory
          path: results/egotactile_full_stage0_inventory.json
          retention-days: 30
