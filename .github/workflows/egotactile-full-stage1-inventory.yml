name: EgoTactile full 63-object Stage 1 event inventory

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_full_stage1_event_inventory.py"
      - ".github/workflows/egotactile-full-stage1-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install signal-processing dependencies
        run: python -m pip install --upgrade huggingface_hub "zarr<3" numcodecs numpy scipy
      - name: Run all 63 object pressure-only event and target audits
        run: |
          python scripts/run_full_stage1_event_inventory.py --output results/egotactile_stage1_full_event_inventory.json
      - name: Upload complete Stage 1 inventory
        uses: actions/upload-artifact@v4
        with:
          name: egotactile-full-stage1-event-inventory
          path: results/egotactile_stage1_full_event_inventory.json
          retention-days: 30
