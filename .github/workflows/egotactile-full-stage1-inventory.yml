name: EgoTactile full 63-object Stage 1 event inventory

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_full_stage1_event_inventory.py"
      - ".github/workflows/egotactile-full-stage1-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install signal-processing dependencies
        run: python -m pip install --upgrade huggingface_hub "zarr<3" numcodecs numpy scipy
      - name: Run all 63 object pressure-only event and target audits
        run: |
          python scripts/run_full_stage1_event_inventory.py --output results/egotactile_stage1_full_event_inventory.json
      - name: Run Stage 2 no-model Support information test
        run: |
          python scripts/run_no_model_support_test.py --input results/egotactile_stage1_full_event_inventory.json --output results/egotactile_stage2_no_model_support_test.json --bootstrap-reps 5000 --seed 20261126
      - name: Upload Stage 1 and Stage 2 reports
        uses: actions/upload-artifact@v4
        with:
          name: egotactile-full-stage1-and-stage2-no-model
          path: |
            results/egotactile_stage1_full_event_inventory.json
            results/egotactile_stage2_no_model_support_test.json
          retention-days: 30
