name: EgoTactile Stage 2 corrected no-model analysis

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_no_model_support_test.py"
      - ".github/workflows/egotactile-stage2-corrected.yml"
  workflow_dispatch:
    inputs:
      stage1_run_id:
        description: "Completed full Stage 1 workflow run ID"
        required: true
        default: "45809071334"

permissions:
  contents: read
  actions: read

jobs:
  corrected-stage2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download completed full Stage 1 artifact
        uses: actions/download-artifact@v4
        with:
          name: egotactile-full-stage1-and-stage2-no-model
          path: artifacts
          run-id: ${{ github.event.inputs.stage1_run_id || '45809071334' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install analysis dependency
        run: python -m pip install --upgrade numpy
      - name: Run corrected all-event and exact-five sensitivity analyses
        run: |
          python scripts/run_no_model_support_test.py \
            --input artifacts/results/egotactile_stage1_full_event_inventory.json \
            --output results/egotactile_stage2_no_model_support_test_corrected.json \
            --bootstrap-reps 5000 --seed 20261126
      - name: Upload corrected Stage 2 report
        uses: actions/upload-artifact@v4
        with:
          name: egotactile-stage2-corrected-no-model
          path: |
            results/egotactile_stage2_no_model_support_test_corrected.json
            artifacts/results/egotactile_stage1_full_event_inventory.json
          retention-days: 30
