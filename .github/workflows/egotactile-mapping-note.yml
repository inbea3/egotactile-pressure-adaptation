name: EgoTactile tactile mapping note

on:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_tactile_mapping_note.py"
      - ".github/workflows/egotactile-mapping-note.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-mapping-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependency
        run: python -m pip install --upgrade huggingface_hub
      - name: Fetch pinned tactile mapping note
        run: python scripts/fetch_tactile_mapping_note.py --output results/egotactile_mapping_note_audit.json
      - name: Upload mapping note audit
        uses: actions/upload-artifact@v4
        with:
          name: egotactile-tactile-mapping-note
          path: results/egotactile_mapping_note_audit.json
          retention-days: 30
